<script>
let q1 = "";
let q2 = "";

let codes = {};

function setQ1(val) {
  q1 = val;
}

function setQ2(val) {
  q2 = val;
}

// создаём код на основе ответов
function generateCodeFromAnswers() {
  let base = Math.floor(Math.random() * 90) + 10;

  // влияние 1 вопроса
  if (q1 === "a") base += 100;
  if (q1 === "b") base += 200;

  // влияние 2 вопроса
  if (q2 === "a") base += 1;
  if (q2 === "b") base += 2;
  if (q2 === "c") base += 3;
  if (q2 === "d") base += 4;

  return base;
}

function claim() {
  if (!q1 || !q2) {
    document.getElementById("result").innerText = "Answer all questions!";
    return;
  }

  let code = generateCodeFromAnswers();

  codes[code] = true;
  localStorage.setItem("codes_cache", JSON.stringify(codes));

  document.getElementById("result").innerText =
    "Your code: " + code + " (depends on your answers)";
}
</script>
