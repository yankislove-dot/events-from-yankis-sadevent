<!DOCTYPE html>
<html>
<head>
  <title>Sad Badge Event</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }

    .top-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .title {
      text-align: left;
      margin: 10px;
      font-size: 18px;
      opacity: 0.8;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px;
    }

    .row img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .box {
      margin: 20px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      width: 60%;
      margin-left: auto;
      margin-right: auto;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<img class="top-img" src="https://via.placeholder.com/1200x250">

<div class="title">Events from yankis. Sad Badge.</div>

<div class="row">
  <img src="https://via.placeholder.com/200">
  <img src="https://via.placeholder.com/200">
</div>

<div class="box">
  <p>1: Have you ever been sad?</p>
  <button onclick="q1='a'">A) Yes</button>
  <button onclick="q1='b'">B) No</button>

  <p>2: How long ago were you sad?</p>
  <button onclick="q2='a'">A) Now</button>
  <button onclick="q2='b'">B) Yesterday</button>
  <button onclick="q2='c'">C) Week ago</button>
  <button onclick="q2='d'">D) Month+</button>

  <br><br>

  <button onclick="claim()">Claim Badge</button>

  <p id="result"></p>
</div>

<script>
let q1 = "";
let q2 = "";

function claim() {
  if (!q1 || !q2) {
    document.getElementById("result").innerText = "Answer all questions!";
    return;
  }

  let code = Math.floor(Math.random() * 90000) + 10000;

  localStorage.setItem("sad_code", code);

  document.getElementById("result").innerText =
    "Your code: " + code + " (use in Roblox)";
}
</script>

</body>
</html>
